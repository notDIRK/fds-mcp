name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check src tests

      - name: Run the offline test suite
        run: python -m pytest -m "not live" -v

      - name: Check that no secret files are tracked
        run: |
          if git ls-files | grep -E '(^|/)(tokens\.json|config\.json|\.env)$|\.(pem|key)$'; then
            echo "::error::A secret-bearing file is tracked in git."
            exit 1
          fi
